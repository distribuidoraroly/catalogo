name: Fix catalog stability

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply catalog fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('distribuidora-roly.html'), Path('distribuidora-roly (1).html')]

          stability_script = r'''
          <script>
          (() => {
            const unlockScrollIfSafe = () => {
              const lockingSelectors = ['#cart-backdrop.open', '#admin-auth-backdrop.open', '#admin-backdrop.open', '#edit-backdrop.open', '#mobile-menu.open'];
              const locked = lockingSelectors.some((selector) => document.querySelector(selector));
              if (!locked && document.body) {
                document.documentElement.style.removeProperty('overflow');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('position');
                document.body.style.removeProperty('touch-action');
              }
            };

            const dedupeFilters = () => {
              const container = document.getElementById('filter-btns');
              if (!container) return;
              const seen = new Set();
              container.querySelectorAll('.filter-btn').forEach((button) => {
                const key = button.dataset.cat || button.textContent.trim();
                if (seen.has(key)) button.remove();
                else seen.add(key);
              });
            };

            const stabilize = () => {
              const adminBackdrop = document.getElementById('admin-backdrop');
              const adminPanel = document.getElementById('admin-panel');
              if (adminBackdrop) adminBackdrop.classList.remove('open');
              if (adminPanel) adminPanel.classList.remove('open');
              const adminToggle = document.getElementById('admin-toggle');
              if (adminToggle) adminToggle.classList.remove('active');
              dedupeFilters();
              unlockScrollIfSafe();
            };

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', stabilize, { once: true });
            else stabilize();
            window.addEventListener('load', stabilize, { once: true });
            window.addEventListener('pageshow', stabilize);
            window.addEventListener('resize', unlockScrollIfSafe, { passive: true });

            const filterContainer = document.getElementById('filter-btns');
            if (filterContainer && window.MutationObserver) {
              new MutationObserver(() => dedupeFilters()).observe(filterContainer, { childList: true });
            }
          })();
          </script>
          '''

          changed = False
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace(
                  '<div id="admin-backdrop" onclick="cerrarAdmin()" class="open"></div>',
                  '<div id="admin-backdrop" onclick="cerrarAdmin()" class=""></div>'
              )
              text = text.replace(
                  '<div id="admin-panel" class="open">',
                  '<div id="admin-panel" class="">'
              )
              text = text.replace(
                  '<button id="admin-toggle" onclick="pedirAccesoAdmin()" class="revealed active">',
                  '<button id="admin-toggle" onclick="pedirAccesoAdmin()" class="revealed">'
              )

              marker = "  const filterContainer = document.getElementById('filter-btns');"
              replacement = "  const filterContainer = document.getElementById('filter-btns');\n  if (filterContainer) filterContainer.innerHTML = '';"
              text = text.replace(marker, replacement)

              if 'CATALOG_STABILITY_PATCH_V1' not in text:
                  text = text.replace('</body>', '<!-- CATALOG_STABILITY_PATCH_V1 -->\n' + stability_script + '\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed = True

          if not changed:
              print('No changes required')
          else:
              print('Catalog fixes applied')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html distribuidora-roly.html 'distribuidora-roly (1).html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix catalog scroll, admin overlay and duplicate filters"
            git push
          fi
